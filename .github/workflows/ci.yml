name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q -k __deliberately_failing_for_ci_ok_proof__
      - name: Lint
        run: python -m ruff check src tests

  # Single, stable status context that a branch ruleset can require.
  # GitHub always appends the matrix values to a matrix job's name, so the
  # matrix (`test`) cannot itself be the required check; this job only
  # aggregates its result.
  ci-ok:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless the test job succeeded
        run: |
          echo "test: ${{ needs.test.result }}"
          [ "${{ needs.test.result }}" = "success" ]
